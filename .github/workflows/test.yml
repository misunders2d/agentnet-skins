name: Skin compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          AGENTNET_NOTIFY: "off"
      # No upload-artifact: screenshots, logs and fixture data stay private.
